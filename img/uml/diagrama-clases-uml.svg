<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780">
    <defs>
        <marker id="arrowSimple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M 0 1 L 9 5 L 0 9 z" fill="#000000"/>
        </marker>
    </defs>

    <rect width="1200" height="780" fill="#ffffff"/>

    <!-- Título idéntico al formato del ejemplo -->
