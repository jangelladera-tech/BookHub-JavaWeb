    <!-- Rombo negro en Lector -->
    <polygon points="280,140 295,133 310,140 295,147" fill="#000000" stroke="#000000" stroke-width="1.5"/>
    <line x1="310" y1="140" x2="420" y2="140" stroke="#000000" stroke-width="1.8"/>
    <text x="395" y="130" fill="#000000" font-size="12" font-weight="700" font-family="'Segoe UI', sans-serif">1...*</text>
    
    <line x1="535" y1="262" x2="535" y2="350" stroke="#000000" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrowSimple)"/>
    <text x="548" y="310" fill="#000000" font-size="12" font-weight="700" font-family="'Segoe UI', sans-serif">1...*</text>
    
    <path d="M 420 420 L 320 420 L 320 220 L 280 220" fill="none" stroke="#000000" stroke-width="1.8"/>
    <text x="330" y="325" fill="#000000" font-size="11.5" font-weight="600" font-family="'Segoe UI', sans-serif">Entrega,</text>
    <text x="330" y="342" fill="#000000" font-size="11.5" font-weight="600" font-family="'Segoe UI', sans-serif">recibe</text>
    
    <!-- Rama hacia Libro -->
    <path d="M 650 170 L 825 170 L 825 240" fill="none" stroke="#000000" stroke-width="1.8"/>
    <text x="715" y="160" fill="#000000" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">necesita</text>
    <text x="812" y="230" fill="#000000" font-size="12" font-weight="700" font-family="'Segoe UI', sans-serif">1</text>

    <!-- Rama hacia Donacion / Revista -->
    <path d="M 825 170 L 1065 170 L 1065 240" fill="none" stroke="#000000" stroke-width="1.8"/>
