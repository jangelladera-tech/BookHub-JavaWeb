        <text x="0" y="19" fill="#1e293b" font-size="12" font-family="'Segoe UI', Roboto, sans-serif">Nombre : String</text>
        <text x="0" y="38" fill="#1e293b" font-size="12" font-family="'Segoe UI', Roboto, sans-serif">Correo : String</text>
        <text x="0" y="57" fill="#1e293b" font-size="12" font-family="'Segoe UI', Roboto, sans-serif">Telefono : String</text>
