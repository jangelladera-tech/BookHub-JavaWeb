<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
    <defs>
        <linearGradient id="bhGradBack" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e3a8a"/>
            <stop offset="100%" stop-color="#2563eb"/>
        </linearGradient>
        <linearGradient id="bhGradPageLeft" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#e0e7ff"/>
            <stop offset="100%" stop-color="#ffffff"/>
        </linearGradient>
        <linearGradient id="bhGradPageRight" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#cbd5e1"/>
        </linearGradient>
        <linearGradient id="bhGradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b"/>
            <stop offset="100%" stop-color="#d97706"/>
        </linearGradient>
        <filter id="bhShadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
        </filter>
    </defs>
    <!-- Contenedor redondeado tipo app icon moderno -->
    <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#bhGradBack)" filter="url(#bhShadow)"/>
    
    <!-- Lomo base del libro -->
    <path d="M 8 35 C 16 33, 24 35, 24 35 C 24 35, 32 33, 40 35 L 40 18 C 32 16, 24 18, 24 18 C 24 18, 16 16, 8 18 Z" fill="#0f172a" opacity="0.4"/>
    
    <!-- Hoja Izquierda -->
    <path d="M 9 33 C 15 31, 23 32.5, 23 32.5 L 23 15.5 C 23 15.5, 15 14, 9 16 Z" fill="url(#bhGradPageLeft)"/>
    
    <!-- Hoja Derecha -->
    <path d="M 25 32.5 C 25 32.5, 33 31, 39 33 L 39 16 C 33 14, 25 15.5, 25 15.5 Z" fill="url(#bhGradPageRight)"/>
    
    <!-- Líneas de texto estilizadas hoja izquierda -->
    <path d="M 12 19 L 20 18.2 M 12 22.5 L 20 21.7 M 12 26 L 18 25.3" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- Líneas de texto estilizadas hoja derecha -->
    <path d="M 28 18.2 L 36 19 M 28 21.7 L 36 22.5 M 28 25.3 L 34 26" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- Marcador de libro dorado central colgante -->
    <path d="M 22.5 15 L 25.5 15 L 25.5 25 L 24 23.5 L 22.5 25 Z" fill="url(#bhGradAccent)"/>
    
    <!-- Destello estrella de conocimiento arriba a la derecha -->
    <path d="M 36 9 L 37 11.5 L 39.5 12.5 L 37 13.5 L 36 16 L 35 13.5 L 32.5 12.5 L 35 11.5 Z" fill="#fbbf24"/>
</svg>
